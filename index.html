<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d946ef" />
  <meta name="description" content="A simple, beautiful todo list widget" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: rgba(22, 10, 40, 0.92);
      --bg-card: rgba(60, 30, 90, 0.5);
      --bg-card-hover: rgba(80, 40, 120, 0.55);
      --bg-input: rgba(50, 25, 80, 0.6);
      --accent: #d946ef;
      --accent-glow: rgba(217, 70, 239, 0.35);
      --accent-hover: #e879f9;
      --accent-soft: rgba(217, 70, 239, 0.15);
      --text-primary: #f5eeff;
      --text-secondary: #c4a8e0;
      --text-done: #6b4d8a;
      --danger: #f472b6;
      --success: #a78bfa;
      --success-check: #e9d5ff;
      --border: rgba(217, 70, 239, 0.15);
      --border-strong: rgba(217, 70, 239, 0.3);
      --radius: 14px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #1a0a2e, #16082a, #200e3a);
      color: var(--text-primary);
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f0abfc, #d946ef, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .task-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.4px;
      background: var(--bg-card);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ===== Container ===== */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 16px;
      overflow: hidden;
    }

    /* ===== Add Section ===== */
    .add-section {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 14px;
    }

    .task-input {
      flex: 1;
      height: 46px;
      padding: 0 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      transition: all 0.25s ease;
    }

    .task-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.7;
    }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), 0 0 20px rgba(217, 70, 239, 0.1);
    }

    .add-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #d946ef, #a855f7);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(217, 70, 239, 0.3);
    }

    .add-btn:hover {
      background: linear-gradient(135deg, #e879f9, #c084fc);
      transform: scale(1.06);
      box-shadow: 0 4px 24px rgba(217, 70, 239, 0.45);
    }

    .add-btn:active { transform: scale(0.95); }

    /* ===== Task List ===== */
    .task-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    .task-list::-webkit-scrollbar { width: 5px; }
    .task-list::-webkit-scrollbar-track { background: transparent; }
    .task-list::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.3);
      border-radius: 10px;
    }

    /* ===== Task Item ===== */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      margin-bottom: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(217, 70, 239, 0.25);
    }

    .task-item.done { opacity: 0.6; }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text-done);
    }
    .task-item.done .task-checkbox {
      background: linear-gradient(135deg, #a855f7, #d946ef);
      border-color: transparent;
    }
    .task-item.done .task-checkbox::after { opacity: 1; }

    /* Checkbox */
    .task-checkbox {
      width: 22px; height: 22px;
      flex-shrink: 0;
      border: 2px solid rgba(168, 85, 247, 0.5);
      border-radius: 7px;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
      background: transparent;
    }
    .task-checkbox:hover {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .task-checkbox::after {
      content: '✓';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px; font-weight: 700;
      color: var(--success-check);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    /* Task Text */
    .task-text {
      flex: 1;
      font-size: 13.5px;
      color: var(--text-primary);
      line-height: 1.4;
      word-break: break-word;
      cursor: default;
    }

    /* Edit Input */
    .task-edit-input {
      flex: 1; height: 32px;
      padding: 0 10px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Action Buttons */
    .task-actions {
      display: flex; gap: 3px;
      opacity: 0;
      transition: opacity 0.15s ease;
      flex-shrink: 0;
    }
    .task-item:hover .task-actions { opacity: 1; }

    .action-btn {
      width: 28px; height: 28px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .action-btn.edit-btn:hover { background: var(--accent-soft); color: var(--accent-hover); }
    .action-btn.delete-btn:hover { background: rgba(244,114,182,0.15); color: var(--danger); }
    .action-btn.save-btn { color: var(--success); }
    .action-btn.save-btn:hover { background: rgba(168,85,247,0.2); }
    .action-btn.cancel-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

    /* ===== Footer ===== */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      flex-shrink: 0;
    }

    .clear-done-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }
    .clear-done-btn:hover {
      background: rgba(244, 114, 182, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ===== Empty State ===== */
    .empty-state {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .empty-state.visible { display: flex; }
    .empty-icon { font-size: 36px; filter: drop-shadow(0 0 12px rgba(217,70,239,0.4)); }
    .empty-state p { font-size: 13px; color: var(--text-secondary); }

    /* Removing animation */
    .task-item.removing {
      animation: slideOut 0.2s ease forwards;
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(30px); }
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-title">📝 My Tasks</span>
    <span class="task-count" id="taskCount">0 tasks</span>
  </div>

  <div class="container">
    <div class="add-section">
      <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done?" maxlength="120" autocomplete="off" />
      <button class="add-btn" id="addBtn" title="Add task">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState">
      <span class="empty-icon">✨</span>
      <p>No tasks yet — add one above!</p>
    </div>
  </div>

  <div class="footer">
    <button class="clear-done-btn" id="clearDoneBtn">Clear completed</button>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const emptyState = document.getElementById('emptyState');
    const clearDoneBtn = document.getElementById('clearDoneBtn');

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function render() {
      taskList.innerHTML = '';
      todos.forEach((todo, i) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (todo.done ? ' done' : '');

        const cb = document.createElement('button');
        cb.className = 'task-checkbox';
        cb.addEventListener('click', () => { todos[i].done = !todos[i].done; save(); render(); });

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = todo.text;

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn edit-btn';
        editBtn.innerHTML = '✏️';
        editBtn.addEventListener('click', () => startEdit(i));

        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn delete-btn';
        delBtn.innerHTML = '🗑️';
        delBtn.addEventListener('click', () => {
          li.classList.add('removing');
          li.addEventListener('animationend', () => { todos.splice(i,1); save(); render(); }, {once:true});
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(actions);
        taskList.appendChild(li);
      });
      updateMeta();
    }

    function updateMeta() {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;
      taskCount.textContent = total === 0 ? '0 tasks' : done + '/' + total + ' done';
      emptyState.classList.toggle('visible', total === 0);
      taskList.style.display = total === 0 ? 'none' : '';
    }

    function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

    function addTodo() {
      const text = taskInput.value.trim();
      if (!text) return;
      todos.unshift({ text, done: false });
      save(); render();
      taskInput.value = '';
      taskInput.focus();
    }

    addBtn.addEventListener('click', addTodo);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    function startEdit(index) {
      const li = taskList.querySelectorAll('.task-item')[index];
      if (!li) return;
      const textSpan = li.querySelector('.task-text');
      const actionsDiv = li.querySelector('.task-actions');

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-edit-input';
      input.value = todos[index].text;
      input.maxLength = 120;
      textSpan.replaceWith(input);
      input.focus(); input.select();

      actionsDiv.innerHTML = '';
      actionsDiv.style.opacity = '1';

      const saveBtn = document.createElement('button');
      saveBtn.className = 'action-btn save-btn';
      saveBtn.innerHTML = '✔️';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'action-btn cancel-btn';
      cancelBtn.innerHTML = '✖️';

      actionsDiv.appendChild(saveBtn);
      actionsDiv.appendChild(cancelBtn);

      function doSave() {
        const t = input.value.trim();
        if (t) { todos[index].text = t; save(); }
        render();
      }

      saveBtn.addEventListener('click', doSave);
      cancelBtn.addEventListener('click', render);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') doSave();
        if (e.key === 'Escape') render();
      });
    }

    clearDoneBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save(); render();
    });

    render();

    // Register Service Worker for PWA install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
